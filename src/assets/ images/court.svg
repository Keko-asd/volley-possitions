<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.7 -0.5 10.4 11.1" width="520" height="555" font-family="'IBM Plex Sans', Arial, sans-serif">
  <!-- Координаты в метрах. Своя половина площадки 9 × 9 м: x 0…9 (слева направо), y 0…9 (от сетки к лицевой линии). -->
  <rect x="-0.7" y="-0.5" width="10.4" height="11.1" fill="#F1EBDD"/>
  <rect x="0" y="0" width="9" height="9" fill="#E9DCC2" stroke="#1F2430" stroke-width="0.06"/>

  <!-- Линия атаки (3 м от сетки) -->
  <line x1="0" y1="3" x2="9" y2="3" stroke="#1F2430" stroke-width="0.05"/>

  <!-- Границы зон -->
  <line x1="3" y1="0" x2="3" y2="9" stroke="#1F2430" stroke-width="0.025" stroke-dasharray="0.11 0.14" opacity="0.45"/>
  <line x1="6" y1="0" x2="6" y2="9" stroke="#1F2430" stroke-width="0.025" stroke-dasharray="0.11 0.14" opacity="0.45"/>

  <!-- Сетка -->
  <line x1="-0.55" y1="-0.09" x2="9.55" y2="-0.09" stroke="#1F2430" stroke-width="0.14"/>
  <line x1="-0.55" y1="-0.09" x2="9.55" y2="-0.09" stroke="#FFFFFF" stroke-width="0.035" stroke-dasharray="0.05 0.05"/>

  <!-- Подписи -->
  <!--<g fill="#1F2430" fill-opacity="0.45">
    <text x="-0.6" y="-0.24" font-size="0.29" font-weight="700" letter-spacing="0.027">СЕТКА</text>
    <text x="0.14" y="3.38" font-size="0.25">линия атаки · 3 м</text>
    <text x="8.9" y="10.35" font-size="0.25" text-anchor="end">место подачи</text>
    <text x="-0.6" y="3.6" font-size="0.23">замена</text>
  </g>-->

  <!-- Номера зон -->
  <g fill="#1F2430" fill-opacity="0.45" font-size="0.38" font-weight="700" text-anchor="end">
    <text x="2.8" y="2.8">4</text>
    <text x="5.8" y="2.8">3</text>
    <text x="8.8" y="2.8">2</text>
    <text x="2.8" y="8.8">5</text>
    <text x="5.8" y="8.8">6</text>
    <text x="8.8" y="8.8">1</text>
  </g>
</svg>
